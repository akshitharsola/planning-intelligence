source_entity: GALWAY_COUNTY_COUNCIL
planning_authority: Galway County Council
parser_family: arcgis_feature_service

# Public, no-auth ArcGIS Feature Service confirmed live (verified via direct
# REST query). Replaces the original placeholder PDF weekly-list approach —
# galwaycoco.ie redirects to galway.ie and is not directly scrapable;
# eplanning.ie's HTML table was assessed as fragile. This endpoint returns
# structured JSON with a clean incremental watermark (OBJECTID), so no PDF
# parsing or boilerplate-stripping is needed for County.
arcgis_query_url: "https://services1.arcgis.com/mJI7JYqAOKXPG7Hh/arcgis/rest/services/GCC_PlanningRegisterPts_16/FeatureServer/2/query"
watermark_field: "OBJECTID"
page_size: 1000
out_fields:
  - OBJECTID
  - County
  - PlanningAuthority
  - ApplicationNumber
  - ApplicantName
  - ReceivedDate
  - ApplicationType
  - ApplicationStatus
  - Location
  - Description
  - Decision
  - DecisionDate
  - DecisionDueDate
  - WithdrawnDate
  - GrantDate
  - ExpiryDate
  - AppealNotificationDate
  - AppealRefNum
  - AppealDecision
  - AppealDecisionDate
  - ITMEasting
  - ITMNorthing
  - MoreInfo
  - GlobalID
